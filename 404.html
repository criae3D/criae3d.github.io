<!doctype html>
<!--
  Página "não encontrada". Sem ela, o GitHub Pages responde 503 (erro de servidor) para
  qualquer endereço que não existe, e o Google entende que o site está fora do ar.
  Fica fora do Vite (pasta public/): é copiada como está.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada · Criaê 3D</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        --fundo: #f6f6f8;
        --texto: #2f3237;
        --suave: #5b6068;
        --laranja: #fc7509;
        --laranja-texto: #1f2124;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--fundo);
        color: var(--texto);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      img {
        width: 72px;
        height: auto;
        border-radius: 18px;
        box-shadow: 0 4px 14px rgb(47 50 55 / 0.12);
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 1.75rem;
        line-height: 1.2;
      }
      p {
        margin: 0 0 24px;
        color: var(--suave);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        background: var(--laranja);
        color: var(--laranja-texto);
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--texto);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/apple-touch-icon.png" width="180" height="180" alt="Criaê 3D" />
      <h1>Essa página não foi impressa</h1>
      <p>O endereço que você abriu não existe ou mudou de lugar.</p>
      <a href="/">Voltar para a Criaê 3D</a>
    </main>
  </body>
</html>
